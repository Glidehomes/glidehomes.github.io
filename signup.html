<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - GlideHomes</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f2a3d;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.box{background:#fff;width:100%;max-width:420px;padding:26px;border-radius:14px}h1{text-align:center;color:#0f2a3d}h1 span{color:#ffb703}p{text-align:center;color:#666;font-size:14px;margin:8px 0 18px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;outline:none}button{width:100%;padding:13px;background:#ffb703;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}a{color:#0f2a3d;text-decoration:none;font-weight:bold}#msg{text-align:center;margin-top:10px;font-size:14px;color:red}</style>
</head>
<body>
<div class="box">
<h1>Glide<span>Homes</span></h1>
<p>Create your free account</p>
<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email">
<input id="phone" placeholder="Phone e.g 0803...">
<select id="role"><option value="user">I want to Buy / Rent</option><option value="agent">I am an Agent</option><option value="admin">I am Admin</option></select>
<input id="password" type="password" placeholder="Password (6+ characters)">
<button onclick="doSignup()">Create Account</button>
<p id="msg"></p>
<p>Already have account? <a href="login.html">Login</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://plhvtenxcuihgldxwcrw.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y0TYPZEWeRswrKu88TE4sg_0S5-uMJO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function doSignup(){
  const name=document.getElementById('name').value;
  const email=document.getElementById('email').value;
  const phone=document.getElementById('phone').value;
  const role=document.getElementById('role').value;
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  if(!name||!email||!password){msg.innerText="Fill all fields";return;}
  msg.style.color="black"; msg.innerText="Creating account...";
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name,phone:phone,role:role}}});
  if(error){msg.style.color="red";msg.innerText=error.message;return;}
  msg.style.color="green";msg.innerText="Account created! Check your email, then Login.";
  setTimeout(()=>{window.location.href="login.html"},2000);
}
</script>
</body>
</html>
